<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدليل التنفيذي للتقييم الذاتي</title>
<meta name="theme-color" content="#0a0a1a">
<!-- iOS App Support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دليل التقييم">
<meta name="mobile-web-app-capable" content="yes">
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');

:root {
  --bg-gradient: linear-gradient(135deg, #1a1f35 0%, #2d3748 100%);
  --card-bg: rgba(255, 255, 255, 0.06);
  --card-border: rgba(255, 255, 255, 0.15);
  --primary: #9aa5b1;
  --primary-light: #cdd5dc;
  --text: #eef1f4;
  --text-light: #9aa5b1;
  --border: rgba(255,255,255,0.14);
  --radius: 14px;
  --transition-fast: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;

  --content-font-size: 16px;
  --font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-family);
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  transition: background 0.5s ease, font-family 0.3s ease;
}

.card-title { font-size: calc(var(--content-font-size) + 2px); transition: font-size 0.3s ease; }
.card-desc { font-size: var(--content-font-size); transition: font-size 0.3s ease; }
.card-meta { font-size: calc(var(--content-font-size) - 2px); transition: font-size 0.3s ease; }
.page-subtitle { font-size: calc(var(--content-font-size) - 1px); transition: font-size 0.3s ease; }
.practice-detail-card li { font-size: var(--content-font-size); transition: font-size 0.3s ease; }
.section-content li { font-size: var(--content-font-size); transition: font-size 0.3s ease; }
.breadcrumb-item { font-size: calc(var(--content-font-size) - 2px); transition: font-size 0.3s ease; }
.section-label { font-size: calc(var(--content-font-size) - 1px); transition: font-size 0.3s ease; }

.logo { font-size: 1.25rem; }
.card-icon { font-size: 1.2rem; }
.practice-mini .card-icon { font-size: 0.95rem; }
.settings-btn { font-size: 1.5rem; }

.header {
  background: rgba(26, 31, 53, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  color: var(--text);
  padding: 1rem 2rem;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
  max-width: 1200px;
  margin: 0 auto;
}
.logo { display: flex; align-items: center; gap: 0.75rem; font-weight: 800; }
.logo-icon {
  width: 40px; height: 40px;
  border: 2px solid var(--primary-light);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
  background: rgba(255,255,255,0.05);
}
.settings-btn {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: var(--text);
  width: 48px; height: 48px;
  border-radius: 50%;
  cursor: pointer;
  transition: var(--transition-fast);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}
.settings-btn:hover { background: rgba(255,255,255,0.15); transform: rotate(45deg); }

.layout {
  position: relative; z-index: 1; width: 100%; max-width: 1200px;
  margin: 0 auto; padding: 1.5rem; min-height: calc(100vh - 80px);
}
.main { background: transparent; padding: 1.5rem 0; min-height: 500px; width: 100%; }
.breadcrumb {
  display: flex; align-items: center; gap: 0.5rem; color: var(--text-light);
  margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.breadcrumb-item {
  cursor: pointer; transition: var(--transition-fast); padding: 0.3rem 0.75rem;
  border-radius: 20px; border: 1px solid transparent;
}
.breadcrumb-item:hover { border-color: var(--primary-light); color: var(--primary-light); }
.breadcrumb-item.current { color: var(--text); font-weight: 700; cursor: default; border-color: var(--primary-light); background: rgba(255,255,255,0.05); }
.breadcrumb-sep { color: var(--text-light); }
.page-subtitle { color: var(--text-light); margin-bottom: 2rem; }

.cards-grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; }
.card {
  background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--card-border); border-right: 3px solid var(--card-color, var(--primary));
  border-radius: var(--radius); padding: 1.35rem 1.5rem; cursor: pointer;
  transition: var(--transition-fast); display: flex; align-items: center; justify-content: center;
  text-align: center; min-height: 84px;
}
.card:hover { background: rgba(255,255,255,0.12); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
.card:active { background: rgba(255,255,255,0.18); transform: translateY(0); }
.card-icon { margin-inline-end: 0.6rem; line-height: 1; }
.card-title { font-weight: 700; color: var(--card-color, var(--text)); line-height: 1.4; }
.card-desc { color: var(--text-light); line-height: 1.6; margin-top: 0.4rem; }
.card-meta { display: flex; gap: 0.75rem; color: var(--text-light); margin-top: 0.5rem; flex-wrap: wrap; justify-content: center; }
.card-meta-item { display: flex; align-items: center; gap: 0.3rem; }
.card-stack { flex-direction: column; }
.practice-mini { flex-direction: row; }

.practice-detail-card { align-items: flex-start !important; text-align: right !important; min-height: auto; padding: 1.5rem; cursor: default; }
.practice-detail-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
.practice-detail-card .card-title {
  margin-bottom: 1rem; width: 100%; border-bottom: 1px solid var(--border);
  padding-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem;
}
.practice-detail-card ul { list-style: none; padding: 0; margin: 0; width: 100%; }
.practice-detail-card li {
  padding: 0.6rem 1.5rem 0.6rem 0; position: relative; line-height: 1.7;
  color: var(--text); transition: var(--transition-fast);
}
.practice-detail-card li:hover { color: var(--primary-light); }
.practice-detail-card li::before {
  content: "•"; position: absolute; right: 0; color: var(--card-color, var(--primary-light));
  font-weight: bold; font-size: 1.3rem; line-height: 1.2; top: 0.6rem;
}

.settings-modal {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;
}
.settings-modal.active { display: flex; opacity: 1; }
.settings-content {
  background: rgba(30, 37, 50, 0.95); border: 1px solid var(--card-border);
  border-radius: var(--radius); padding: 2rem; width: 90%; max-width: 420px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform 0.3s ease;
}
.settings-modal.active .settings-content { transform: scale(1); }
.settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
.settings-header h3 { font-size: 1.2rem; color: var(--text); }
.close-btn { background: none; border: none; color: var(--text-light); font-size: 2rem; line-height: 1; cursor: pointer; transition: color 0.2s; }
.close-btn:hover { color: var(--text); }
.setting-item { margin-bottom: 1.5rem; }
.setting-item label { display: block; margin-bottom: 0.6rem; color: var(--primary-light); font-weight: 700; font-size: 0.95rem; }
.color-options { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
.color-btn {
  width: 45px; height: 45px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: var(--transition-fast); box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.color-btn:hover, .color-btn.active { border-color: var(--primary-light); transform: scale(1.15); }
input[type="color"] { width: 45px; height: 45px; border: none; border-radius: 50%; cursor: pointer; background: none; padding: 0; overflow: hidden; }
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border: 2px solid var(--card-border); border-radius: 50%; }
select {
  width: 100%; padding: 0.85rem; border-radius: 10px; border: 1px solid var(--card-border);
  background: rgba(0,0,0,0.3); color: var(--text); font-family: inherit; font-size: 1rem;
  cursor: pointer; outline: none; transition: var(--transition-fast);
}
select:focus { border-color: var(--primary-light); background: rgba(0,0,0,0.5); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-light); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary-light); }

@media (max-width: 640px) {
  .cards-grid { grid-template-columns: 1fr; }
  .header-content { justify-content: center; position: relative; }
  .settings-btn { position: absolute; right: 1rem; }
  .logo { font-size: 1rem; }
  .logo span { display: none; }
  .logo-icon { display: flex; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-content">
    <button id="settingsBtn" class="settings-btn" title="الإعدادات">⚙️</button>
    <div class="logo">
      <div class="logo-icon">📋</div>
      <span>الدليل التنفيذي للتقييم الذاتي</span>
    </div>
  </div>
</header>

<div id="settingsModal" class="settings-modal">
  <div class="settings-content">
    <div class="settings-header">
      <h3>⚙️ الإعدادات</h3>
      <button id="closeSettings" class="close-btn">×</button>
    </div>
    <div class="setting-item">
      <label>🎨 لون الخلفية (تدرج لوني)</label>
      <div class="color-options">
        <button class="color-btn active" style="background: linear-gradient(135deg, #1a1f35, #2d3748)" data-bg="linear-gradient(135deg, #1a1f35 0%, #2d3748 100%)" title="كحلي رمادي"></button>
        <button class="color-btn" style="background: linear-gradient(135deg, #0f2027, #203a43, #2c5364)" data-bg="linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)" title="أخضر مزرق"></button>
        <button class="color-btn" style="background: linear-gradient(135deg, #232526, #414345)" data-bg="linear-gradient(135deg, #232526 0%, #414345 100%)" title="رمادي داكن"></button>
        <button class="color-btn" style="background: linear-gradient(135deg, #141E30, #243B55)" data-bg="linear-gradient(135deg, #141E30 0%, #243B55 100%)" title="أزرق ليلي"></button>
        <input type="color" id="customColor" value="#1a1f35" title="اختر لوناً مخصصاً">
      </div>
    </div>
    <div class="setting-item">
      <label>🔤 حجم نص المحتوى</label>
      <select id="fontSizeSelect">
        <option value="16px">16</option>
        <option value="18px">18</option>
        <option value="20px">20</option>
        <option value="24px">24</option>
        <option value="28px">28</option>
      </select>
    </div>
    <div class="setting-item">
      <label>🔠 نوع الخط</label>
      <select id="fontFamilySelect">
        <option value="'Tajawal', sans-serif">Tajawal</option>
        <option value="Arial, sans-serif">Arial</option>
        <option value="'Courier New', monospace">Courier New</option>
      </select>
    </div>
  </div>
</div>

<div class="layout">
  <main class="main">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="contentArea"></div>
  </main>
</div>

<script>

                  id: "p11-1-2-2", number: "11-1-2-2", name: "يضع المعهد / المركز خططاً تنفيذية للتحسين والتعزيز في ضوء نتائج تقييم الفاعلية التدريبية",
                  procedures: ["عقد اجتماع لإضافة استحداثات جديدة في الخطة التدريبية للتحسين من الفاعلية التدريبية ."],
                  evidenceInternal: ["محضر الاجتماع."],
                  evidenceExternal: []
                },
                {
                  id: "p11-1-2-3", number: "11-1-2-3", name: "يطبق المعهد/المركز الخطط التنفيذية لتطوير وتعزيز الفاعلية التدريبية ضمن جدول زمني مع توفير الآليات الخاصة بمتابعة التنفيذ واتخاذ الإجراءات التصحيحية",
                  procedures: [
                    "يتم ذلك من خلال عمل اجتماعات مستمرة لمتابعة التنفيذ من جانب الادارة على الاستحداثات الجديدة التي تم اضافتها في الخطة التدريبية للتحسين من الفاعلية التدريبية وفقاً للجدول الزمنى المحدد لها.",
                    "حرص المعهد/المركز علي توفير الآليات المناسبة لمتابعة تنفيذ ما تم وضعه من استحداثات جديدة للتطوير."
                  ],
                  evidenceInternal: [
                    "محضر الاجتماع .",
                    "تقرير المتابعة."
                  ],
                  evidenceExternal: []
                }
              ]
            }
          ]
        }
      ]
    }
  ]
};

let currentView = { type: 'home' };

const settingsBtn = document.getElementById('settingsBtn');
const settingsModal = document.getElementById('settingsModal');
const closeSettings = document.getElementById('closeSettings');
const root = document.documentElement;

const savedBg = localStorage.getItem('bg-gradient') || 'linear-gradient(135deg, #1a1f35 0%, #2d3748 100%)';
const savedContentFontSize = localStorage.getItem('content-font-size') || '16px';
const savedFontFamily = localStorage.getItem('font-family') || "'Tajawal', sans-serif";

root.style.setProperty('--bg-gradient', savedBg);
root.style.setProperty('--content-font-size', savedContentFontSize);
root.style.setProperty('--font-family', savedFontFamily);

document.getElementById('fontSizeSelect').value = savedContentFontSize;
document.getElementById('fontFamilySelect').value = savedFontFamily;

settingsBtn.addEventListener('click', () => settingsModal.classList.add('active'));
closeSettings.addEventListener('click', () => settingsModal.classList.remove('active'));
settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) settingsModal.classList.remove('active'); });

document.querySelectorAll('.color-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    const bg = e.target.getAttribute('data-bg');
    root.style.setProperty('--bg-gradient', bg);
    localStorage.setItem('bg-gradient', bg);
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
  });
});

document.getElementById('customColor').addEventListener('input', (e) => {
  const color = e.target.value;
  const gradient = `linear-gradient(135deg, ${color} 0%, #1a1f35 100%)`;
  root.style.setProperty('--bg-gradient', gradient);
  localStorage.setItem('bg-gradient', gradient);
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
});

document.getElementById('fontSizeSelect').addEventListener('change', (e) => {
  const size = e.target.value;
  root.style.setProperty('--content-font-size', size);
  localStorage.setItem('content-font-size', size);
});

document.getElementById('fontFamilySelect').addEventListener('change', (e) => {
  const font = e.target.value;
  root.style.setProperty('--font-family', font);
  localStorage.setItem('font-family', font);
});

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  let html = `<span class="breadcrumb-item ${currentView.type === 'home' ? 'current' : ''}" onclick="goHome()">الرئيسية</span>`;
  if (currentView.domain) {
    html += `<span class="breadcrumb-sep">‹</span>`;
    html += `<span class="breadcrumb-item ${!currentView.standard ? 'current' : ''}" onclick="viewDomain('${currentView.domain.id}')">${currentView.domain.name}</span>`;
  }
  if (currentView.standard) {
    html += `<span class="breadcrumb-sep">‹</span>`;
    html += `<span class="breadcrumb-item ${!currentView.indicator ? 'current' : ''}" onclick="viewStandard('${currentView.domain.id}', '${currentView.standard.id}')">${currentView.standard.number} ${currentView.standard.name}</span>`;
  }
  if (currentView.indicator) {
    html += `<span class="breadcrumb-sep">‹</span>`;
    html += `<span class="breadcrumb-item ${!currentView.practice ? 'current' : ''}" onclick="viewIndicator('${currentView.domain.id}', '${currentView.standard.id}', '${currentView.indicator.id}')">${currentView.indicator.number} ${currentView.indicator.name}</span>`;
  }
  if (currentView.practice) {
    html += `<span class="breadcrumb-sep">‹</span>`;
    html += `<span class="breadcrumb-item current">${currentView.practice.number} ${currentView.practice.name}</span>`;
  }
  bc.innerHTML = html;
}

function renderHome() {
  const content = document.getElementById('contentArea');
  let html = `<div class="cards-grid fade-in">`;
  data.domains.forEach(d => {
    const stdCount = d.standards.length;
    let indCount = 0, pracCount = 0;
    d.standards.forEach(s => { indCount += s.indicators.length; s.indicators.forEach(i => pracCount += i.practices.length); });
    html += `<div class="card card-stack" style="--card-color: ${d.color}" onclick="viewDomain('${d.id}')">
      <div class="card-title"><span class="card-icon">${d.icon}</span>${d.name}</div>
      ${d.description ? `<div class="card-desc">${d.description}</div>` : ''}
      <div class="card-meta"><span class="card-meta-item">${stdCount} معيار</span><span class="card-meta-item">${indCount} مؤشر</span><span class="card-meta-item">${pracCount} ممارسة</span></div>
    </div>`;
  });
  html += `</div>`;
  content.innerHTML = html;
}

function renderDomain(domain) {
  const content = document.getElementById('contentArea');
  let html = `<div class="fade-in"><p class="page-subtitle">${domain.description}</p><div class="cards-grid">`;
  domain.standards.forEach(s => {
    let indCount = 0, pracCount = 0;
    s.indicators.forEach(i => { indCount++; pracCount += i.practices.length; });
    html += `<div class="card card-stack" style="--card-color: ${domain.color}" onclick="viewStandard('${domain.id}', '${s.id}')">
      <div class="card-title"><span class="card-icon">${s.number}</span>${s.name}</div>
      <div class="card-meta"><span class="card-meta-item">${indCount} مؤشر</span><span class="card-meta-item">${pracCount} ممارسة</span></div>
    </div>`;
  });
  html += `</div></div>`;
  content.innerHTML = html;
}

function renderStandard(domain, standard) {
  const content = document.getElementById('contentArea');
  let html = `<div class="fade-in"><div class="cards-grid">`;
  standard.indicators.forEach(i => {
    html += `<div class="card card-stack" style="--card-color: ${domain.color}" onclick="viewIndicator('${domain.id}', '${standard.id}', '${i.id}')">
      <div class="card-title"><span class="card-icon">${i.number}</span>${i.name}</div>
      <div class="card-meta"><span class="card-meta-item">${i.practices.length} ممارسة</span></div>
    </div>`;
  });
  html += `</div></div>`;
  content.innerHTML = html;
}

function renderIndicator(domain, standard, indicator) {
  const content = document.getElementById('contentArea');
  let html = `<div class="fade-in"><div class="cards-grid">`;
  indicator.practices.forEach(p => {
    html += `<div class="card practice-mini" style="--card-color: ${domain.color}" onclick="viewPractice('${domain.id}', '${standard.id}', '${indicator.id}', '${p.id}')">
      <div class="card-title"><span class="card-icon">${p.number}</span>${p.name}</div>
    </div>`;
  });
  html += `</div></div>`;
  content.innerHTML = html;
}

function renderPractice(domain, standard, indicator, practice) {
  const content = document.getElementById('contentArea');
  const p = practice;
  let html = `<div class="fade-in"><div class="cards-grid">`;
  html += `<div class="card card-stack practice-detail-card" style="--card-color: ${domain.color}">
    <div class="card-title"><span class="card-icon">📝</span>الإجراءات المتخذة</div>
    <ul>${p.procedures.map(proc => `<li>${proc}</li>`).join('')}</ul>
  </div>`;
  if (p.evidenceInternal.length > 0) {
    html += `<div class="card card-stack practice-detail-card" style="--card-color: #8ec4ff">
      <div class="card-title"><span class="card-icon">📎</span>دليل مرفق بملف التقييم الذاتي</div>
      <ul>${p.evidenceInternal.map(ev => `<li>${ev}</li>`).join('')}</ul>
    </div>`;
  }
  if (p.evidenceExternal.length > 0) {
    html += `<div class="card card-stack practice-detail-card" style="--card-color: #ffb454">
      <div class="card-title"><span class="card-icon">📁</span>دليل خارجي للإطلاع</div>
      <ul>${p.evidenceExternal.map(ev => `<li>${ev}</li>`).join('')}</ul>
    </div>`;
  }
  html += `</div></div>`;
  content.innerHTML = html;
}

function renderAll() {
  renderBreadcrumb();
  if (currentView.type === 'home') renderHome();
  else if (currentView.type === 'domain') renderDomain(currentView.domain);
  else if (currentView.type === 'standard') renderStandard(currentView.domain, currentView.standard);
  else if (currentView.type === 'indicator') renderIndicator(currentView.domain, currentView.standard, currentView.indicator);
  else if (currentView.type === 'practice') renderPractice(currentView.domain, currentView.standard, currentView.indicator, currentView.practice);
}

function goHome() { currentView = { type: 'home' }; renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function viewDomain(id) { const d = data.domains.find(x => x.id === id); if (!d) return; currentView = { type: 'domain', domain: d }; renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function viewStandard(dId, sId) { const d = data.domains.find(x => x.id === dId); const s = d?.standards.find(x => x.id === sId); if (!d || !s) return; currentView = { type: 'standard', domain: d, standard: s }; renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function viewIndicator(dId, sId, iId) { const d = data.domains.find(x => x.id === dId); const s = d?.standards.find(x => x.id === sId); const i = s?.indicators.find(x => x.id === iId); if (!d || !s || !i) return; currentView = { type: 'indicator', domain: d, standard: s, indicator: i }; renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function viewPractice(dId, sId, iId, pId) { const d = data.domains.find(x => x.id === dId); const s = d?.standards.find(x => x.id === sId); const i = s?.indicators.find(x => x.id === iId); const p = i?.practices.find(x => x.id === pId); if (!d || !s || !i || !p) return; currentView = { type: 'practice', domain: d, standard: s, indicator: i, practice: p }; renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

renderAll();
</script>

</body>
</html>
